version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bidichk
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gosec
    - makezero
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nolintlint
    - thelper
    - usetesting

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
