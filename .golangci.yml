version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bidichk
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocognit
    - gosec
    - intrange
    - makezero
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - predeclared
    - revive
    - thelper
    - usetesting
  settings:
    # Regression gate, not a style target: current worst function scores 45.
    gocognit:
      min-complexity: 50
    revive:
      rules:
        # min/max became builtins in Go 1.21; shadowing them is a real footgun.
        - name: redefines-builtin-id
  exclusions:
    rules:
      # Reading user-specified input files is the CLI's core function; the
      # remaining reads are repo-local testdata with fixed relative roots.
      - linters: [gosec]
        text: "G304"
      # Presentation layer writes to stdout/stderr; a dead writer (broken
      # pipe) is not actionable and must not change exit behavior.
      - linters: [errcheck]
        text: "Error return value of `fmt\\.Fprint"
      # datagen writes compile-time-constant file names under a
      # maintainer-supplied directory; there is no untrusted path input.
      - linters: [gosec]
        text: "G703"
        path: tools/datagen/

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
