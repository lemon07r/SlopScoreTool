version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bidichk
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gosec
    - makezero
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nolintlint
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - testableexamples
    - thelper
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
